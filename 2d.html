<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3a2412" />
    <title>Skyhold Isles — 2D slice (P0)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #3d5e27;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage,
      #stage canvas {
        position: fixed;
        inset: 0;
        display: block;
        touch-action: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff4dc;
        font: 700 22px system-ui, sans-serif;
        text-shadow: 0 2px 0 #3a2412;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="boot">Loading…</div>
